services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: omsdemo
    ports:
      - 5432:5432
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omsdemo"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  omsdemo:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 80
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql:postgres:password@db:5432/omsdemo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 80:80

  nginx:
    image: nginx:latest
    ports:
      - 8080:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - omsdemo

volumes:
  db_data:

      
