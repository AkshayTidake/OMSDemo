name: CI/CD for OMSDemo
on:
    push:
        branches: 
            - dev

jobs:
        build:
            runs-on: ubuntu-latest
            steps:
                - name: Checkout code
                  uses: actions/checkout@v4.2.2
                - name: Set Short SHA Output
                  id: vars
                  run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
                - name: login to Dockerhub
                  uses: docker/login-action@v3
                  with:
                    username: ${{ secrets.DOCKER_USERNAME }}
                    password: ${{ secrets.DOCKER_PASSWORD }}
                - name: Setup Docker Buildx
                  uses: docker/setup-buildx-action@v3
                - name: Extract Docker Metadata
                  id: meta
                  uses: docker/metadata-action@v5.6.0
                  with:
                    images: akshay0918/omsdemo
                    tags: |
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' }}
                      type=sha,format=short
                - name: Build and Push Docker image
                  uses: docker/build-push-action@v6
                  with:
                    context: .
                    file: ./Dockerfile
                    push: true
                    tags: |
                      akshay0918/omsdemo:latest
                      akshay0918/omsdemo:${{ github.sha }}

                    labels: ${{ steps.meta.outputs.labels }}
                    no-cache: true  
        deploy:
            needs: build
            runs-on: ubuntu-latest
            # Defining the app as a service container keeps it alive for your automation tasks
            services:
              oms-app:
                image: akshay0918/omsdemo:latest
                ports:
                  - 80:80
            steps:
                - name: Verify Container is Up and Running
                  run: |
                    echo "Waiting for container to initialize..."
                    sleep 5
                    # Test if the API responds to local network traffic
                    curl --retry 5 --retry-delay 2 http://localhost:80/docs || curl http://localhost:80/