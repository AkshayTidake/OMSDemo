name: CI/CD for OMSDemo
on:
    push:
        branches: 
            - main

jobs:
        build:
            runs-on: ubuntu-latest
            steps:
                - name: Checkout code
                  uses: actions/checkout@v3
                - name: Set up Python
                  uses: actions/setup-python@v4
                  with:
                    python-version: '3.12'
                - name: Install dependencies
                  run: |
                    python -m pip install --upgrade pip
                    pip install -r requirements.txt
                - name: Build Project
                  run: |
                    docker build -t omsdemo .
        
        deploy:
            needs: build
            runs-on: ubuntu-latest
            steps:
                - name: Deploy to Docker
                  run: |
                    docker run -d --name omscontainer -p 80:80 omsdemo


